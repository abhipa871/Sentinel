[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-security"
version = "0.1.0"
description = "Evidence-backed repository security analysis with policy-gated workflows"
requires-python = ">=3.11,<3.15"
dependencies = ["pydantic>=2.12,<3", "networkx>=3.4,<4", "PyYAML>=6,<7", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
agents = ["deepagents==0.7.38", "langchain-openai>=1,<2", "langchain-google-genai>=4.5,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.14"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "sentinel/AGENTS.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["tests/fixtures", "src/sentinel/demo_fixture"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

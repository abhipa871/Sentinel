[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sentinel-security"
version = "0.1.0"
description = "Evidence-backed repository vulnerability analysis and remediation planning"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "deepagents>=0.7.0",
  "defusedxml>=0.7.1",
  "fastapi>=0.121",
  "httpx>=0.28",
  "langchain>=1.0",
  "langchain-openai>=1.0",
  "networkx>=3.4",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "python-dotenv>=1.2",
  "pyyaml>=6.0.2",
  "uvicorn>=0.34",
  "z3-solver>=4.13",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "types-defusedxml>=0.7.0",
  "types-PyYAML>=6.0",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["SENTINEL_FULL_TECHNICAL_IMPLEMENTATION.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[[tool.mypy.overrides]]
module = ["z3"]
ignore_missing_imports = true
